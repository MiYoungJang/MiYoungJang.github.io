# _data/people.yml
# One entry per person shown on the People page.
# NOTE: field names may need to match your al-folio version's schema exactly —
# after cloning, compare with the example entry already in this file and adjust if needed.
#
# `category` groups people into sections on the People page (e.g. Professor,
# Postdoc, PhD Student, MS Student, Alumni, ...). The page will render one
# section header per distinct category value, in the order entries appear
# below. Within a category, entries are listed in the order you put them here.

# ── Professor ──────────────────────────────────────────────────────────────
- name: MiYoung Jang
  also_known_as: Mi Young Jang
  category: Professor
  affiliations:
    name: 
    url: 
  position: 
  image: people/MiYoungJang.jpg
  image_circular: false # crop image to a circle
  address: >
    <p>Dongduk Women's University</p>
    <p>Seoul, South Korea</p>
  email: email@domain.com 
  google_scholar: # add your Google Scholar user ID here if you have a profile
  linkedin: # add your LinkedIn handle here if desired
  github: # add your GitHub username here if desired
  description: >


